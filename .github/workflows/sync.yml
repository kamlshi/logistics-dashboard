name: 同步说明（数据同步已改为本机常驻）

# ============================================================
# 本仓库的腾讯文档数据同步，已改为「本机常驻抓取」模式，
# 不再由 GitHub Actions 云端执行（云端无法访问本机浏览器 Cookie）。
#
# 新方案（长期有效，无需手动复制 Cookie）：
#   1. 本机复用已登录的 qclaw / Edge 浏览器登录态（Cookie 由浏览器自动续期）
#   2. 本地 sync.py 解密浏览器 Cookie → Playwright 打开腾讯文档
#      → 直接从页面内存模型读取整张表 → 生成 data.json
#   3. 推送 data.json 到本仓库 main 分支（GitHub Pages 自动发布）
#   4. 看板 index.html 轮询 https://kamlshi.github.io/logistics-dashboard/data.json
#
# 定时由本机的 WorkBuddy 自动化（或 Windows 任务计划程序）每 30 分钟跑一次：
#   python sync.py
# ============================================================

on:
  # 仅保留手动触发，用于说明 / 排查，不再自动跑云端同步
  workflow_dispatch:
    inputs:
      note:
        description: '仅说明用途，不执行云端同步'
        required: false
        default: 'sync runs locally via qclaw + WorkBuddy automation'

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: 说明
        run: |
          echo "数据同步由本机 sync.py + WorkBuddy 定时自动化完成。"
          echo "云端 GitHub Actions 不再执行同步（无法访问本机浏览器 Cookie）。"
          echo "如需立即同步，请在本机运行：python sync.py"
