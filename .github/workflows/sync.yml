name: 同步腾讯文档数据

on:
  # 手动触发（随时可以点按钮跑一次）
  workflow_dispatch:

  # 定时触发：每 30 分钟同步一次
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests openpyxl

      - name: 同步腾讯文档数据
        env:
          COOKIE: ${{ secrets.TENCENT_COOKIE }}
          DOC_ID: DWk1ESWh0VFJKUGlI
          PAD_ID: ZMDIhtTRJPiH
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GITHUB_REPO: kamlshi/logistics-dashboard
        run: python sync.py

      - name: 检查并推送 data.json
        run: |
          if [ -f data.json ]; then
            # 使用 GitHub API 推送（避免 git push 问题）
            SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_PAT }}" \
              "https://api.github.com/repos/kamlshi/logistics-dashboard/contents/data.json" | jq -r '.sha // empty')

            CONTENT=$(base64 -w 0 data.json)

            PAYLOAD=$(jq -n \
              --arg msg "Auto sync: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
              --arg content "$CONTENT" \
              --arg sha "$SHA" \
              '{message: $msg, content: $content, sha: $sha}')

            curl -s -X PUT \
              -H "Authorization: token ${{ secrets.GITHUB_PAT }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/kamlshi/logistics-dashboard/contents/data.json"

            echo "✅ data.json 推送成功"
          else
            echo "❌ sync.py 未生成 data.json，跳过推送"
          fi
