name: 同步腾讯文档数据

on:
  # 手动触发（随时可以点按钮跑一次）
  workflow_dispatch:

  # 定时触发：每天北京时间 09:00 和 17:00 各同步一次
  # cron 是 UTC 时间，北京时间 = UTC + 8
  #   01:00 UTC = 09:00 北京（早上上班前同步）
  #   09:00 UTC = 17:00 北京（下班前同步）
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 9 * * *'

# 允许写入仓库（用于提交更新后的 HTML）
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步腾讯文档数据
        env:
          TENCENT_COOKIE: ${{ secrets.TENCENT_COOKIE }}
          TENCENT_SHEET_ID: ${{ secrets.TENCENT_SHEET_ID }}
          SHEET_TAB_NAME: ${{ secrets.SHEET_TAB_NAME }}
        run: |
          echo "开始同步腾讯文档数据..."
          python sync.py
        # 失败重试 2 次（跨境网络偶尔抽风）
        continue-on-error: true

      - name: 第二次尝试（网络重试）
        if: failure()
        env:
          TENCENT_COOKIE: ${{ secrets.TENCENT_COOKIE }}
          TENCENT_SHEET_ID: ${{ secrets.TENCENT_SHEET_ID }}
          SHEET_TAB_NAME: ${{ secrets.SHEET_TAB_NAME }}
        run: |
          echo "第一次失败，等待 10 秒后重试..."
          sleep 10
          python sync.py

      - name: 提交并推送更新
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"

          # 检查 index.html 是否有变化
          if git diff --quiet index.html; then
            echo "📭 数据无变化，跳过提交"
          else
            echo "📝 检测到数据变化，提交更新..."
            git add index.html
            git commit -m "自动同步: 数据更新 $(date '+%Y-%m-%d %H:%M' -d '+8 hours')"
            git push
            echo "✅ 已推送，GitHub Pages 将自动重新部署"
          fi
