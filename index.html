<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-spot="std">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>绿动业务物流进度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
<style>
/* ===================== 设计令牌（低饱和 · 商务 · 含明暗两套） ===================== */
:root{
  --bg:#f8fafc; --panel:#ffffff; --panel-2:#f7f9fc;
  --text:#1e293b; --muted:#64748b; --line:rgba(203,213,225,0.6);
  --primary:#2563eb; --primary-soft:#eff4ff; --primary-soft-2:#dbe7ff;
  --accent:#ea580c; --accent-soft:#fdeee3;           /* 绿动/JAYSON 品牌橙 */
  --up:#dc2626; --down:#10b981; --warn:#d97706; --info:#2563eb;
  /* 状态语义色 */
  --st-arrived:#f59e0b; --st-shipped:#3b82f6; --st-delivered:#10b981;
  --shadow-s:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  --shadow-m:0 4px 12px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.04);
  --shadow-l:0 24px 48px rgba(16,24,40,.12);
  --r-l:16px; --r-m:12px; --r-s:8px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-back:cubic-bezier(.34,1.56,.64,1);
  --t-theme:.32s var(--ease-out);
  --font-art:"Noto Serif SC","Songti SC","STSong",serif;
  --font-art-num:"Playfair Display","Noto Serif SC",Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#0f141d; --panel:#161d28; --panel-2:#1b2330;
  --text:#e6ecf5; --muted:#94a3b8; --line:#233044;
  --primary:#4f86f7; --primary-soft:#13233f; --primary-soft-2:#1e3a66;
  --accent:#f0822e; --accent-soft:#3a2410;
  --st-arrived:#f0b04a; --st-shipped:#5b8def; --st-delivered:#2fcf9b;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 4px 14px rgba(0,0,0,.45);
  --shadow-l:0 24px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:13px; -webkit-font-smoothing:antialiased;
  transition:background var(--t-theme),color var(--t-theme);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ===================== 密码门 ===================== */
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%,var(--primary-soft),var(--bg));
  backdrop-filter:blur(6px);transition:opacity .35s var(--ease-out)}
body.unlocked .gate{opacity:0;pointer-events:none}
.gate-card{width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow-l);padding:30px 28px;text-align:center}
.gate-logo{width:54px;height:54px;border-radius:16px;margin:0 auto 14px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:24px;
  background:linear-gradient(135deg,var(--primary),#3b82f6);box-shadow:var(--shadow-m)}
.gate-title{font-size:18px;font-weight:700;letter-spacing:.3px}
.gate-sub{font-size:12px;color:var(--muted);margin-top:4px}
.gate-divider{height:1px;background:var(--line);margin:20px 0}
.gate-hint{font-size:12px;color:var(--muted);margin-bottom:12px}
.gate-row{display:flex;gap:8px}
.gate-row input{flex:1;font-family:inherit;font-size:14px;padding:11px 13px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);outline:none;transition:.2s}
.gate-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.gate-row button{padding:11px 20px;border-radius:11px;background:var(--primary);color:#fff;
  font-size:14px;font-weight:600;box-shadow:var(--shadow-s);transition:.2s}
.gate-row button:hover{filter:brightness(1.05)}
.gate-row button:disabled{opacity:.6;cursor:default}
.gate-error{color:var(--up);font-size:12px;margin-top:10px;min-height:16px}

/* ===================== 布局 ===================== */
.wrap{max-width:1280px;margin:0 auto;padding:18px 22px 48px}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:14px;padding:6px 2px 18px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#3b82f6);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;
  box-shadow:var(--shadow-m)}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.3px}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.topbar .spacer{flex:1}
.toolbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:12px;
  box-shadow:var(--shadow-s);transition:transform .2s var(--ease-out),box-shadow .2s}
.toolbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow-m)}
.chips{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:3px;box-shadow:var(--shadow-s)}
.chips .chip{padding:5px 11px;border-radius:8px;font-size:11.5px;color:var(--muted);transition:.2s}
.chips .chip.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.syncinfo{font-size:11.5px;color:var(--muted)}
.syncinfo b{color:var(--text);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f59e0b;margin-left:4px;vertical-align:middle}

/* 卡片基础 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow-s);position:relative;padding:16px;overflow:hidden;
  transition:background var(--t-theme),border-color .3s var(--ease-out),box-shadow .34s var(--ease-out),
             opacity .3s var(--ease-out),filter .3s var(--ease-out),transform .44s var(--ease-back)}
.card:hover{box-shadow:var(--shadow-m)}

/* ===================== 核心概览 KPI ===================== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 16px}
.stat .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:10px}
.stat .val{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-top:2px;
  font-variant-numeric:tabular-nums}
.stat .sub{font-size:11px;color:var(--muted);margin-top:3px}
.stat .amt{font-size:12.5px;font-weight:600;margin-top:8px;color:var(--text)}
.stat.blue .ico{background:var(--primary-soft);color:var(--primary)}
.stat.arrived .ico{background:color-mix(in srgb,var(--st-arrived) 16%,transparent);color:var(--st-arrived)}
.stat.shipped .ico{background:var(--primary-soft);color:var(--primary)}
.stat.delivered .ico{background:color-mix(in srgb,var(--st-delivered) 16%,transparent);color:var(--st-delivered)}
.rolling{filter:blur(.5px);color:var(--primary)}

/* ===================== 中部图表 ===================== */
.mid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.chartcard h3{margin:0 0 4px;font-size:13.5px;font-weight:700}
.chartcard .hint{font-size:11px;color:var(--muted);margin-bottom:10px}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-box{position:relative;width:170px;height:170px;flex:none}
.donut-box .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-box .center .n{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.donut-box .center .t{font-size:11px;color:var(--muted);margin-top:2px}
.legend{flex:1;display:flex;flex-direction:column;gap:7px}
.legend .item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;cursor:default}
.legend .dot{width:11px;height:11px;border-radius:3px;flex:none}
.legend .ln{font-size:12.5px;flex:1}
.legend .lv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
/* 饼图扇区 */
[data-peers].spot circle[data-peer]{opacity:.22;filter:saturate(.3);transition:opacity .3s var(--ease-out),filter .3s var(--ease-out),transform .36s var(--ease-back)}
[data-peers].spot circle[data-peer].lit{opacity:1;filter:none;transform:scale(1.05)}
circle[data-peer]{transform-box:fill-box;transform-origin:center}

/* ===================== 表格 ===================== */
.tablecard{padding:14px 14px 6px}
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tbar .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tbar .seg button{padding:5px 12px;border-radius:8px;font-size:12px;color:var(--muted);transition:.2s}
.tbar .seg button.on{background:var(--panel);color:var(--primary);font-weight:600;box-shadow:var(--shadow-s)}
.tbar select,.tbar input{font-family:inherit;font-size:12px;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:7px 11px;outline:none}
.tbar input{flex:1;min-width:160px}
.tbar .spacer{flex:1}
.tinfo{font-size:11.5px;color:var(--muted)}
.tinfo .alert{color:var(--warn);font-weight:600}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s var(--ease-out),transform .36s var(--ease-back),opacity .3s var(--ease-out),filter .3s var(--ease-out)}
[data-peers].spot tbody tr[data-peer]{opacity:.34;filter:saturate(.3)}
[data-peers].spot tbody tr[data-peer].lit{opacity:1;filter:none;background:var(--primary-soft);transform:translateX(3px)}
tbody td{padding:10px;font-size:12.5px;vertical-align:middle}
tbody tr:hover{background:var(--panel-2)}
tbody tr.has-alert{background:color-mix(in srgb,var(--warn) 9%,transparent)}
.sumrow{background:var(--panel-2)!important;font-weight:700;cursor:default!important}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge::before{content:"";width:6px;height:6px;border-radius:50%}
.badge-transit{background:color-mix(in srgb,var(--st-arrived) 16%,transparent);color:var(--st-arrived)}
.badge-transit::before{background:var(--st-arrived)}
.badge-shipped{background:var(--primary-soft);color:var(--primary)}
.badge-shipped::before{background:var(--primary)}
.badge-delivered{background:color-mix(in srgb,var(--st-delivered) 16%,transparent);color:var(--st-delivered)}
.badge-delivered::before{background:var(--st-delivered)}
.badge-neutral{background:var(--panel-2);color:var(--muted)}
.badge-neutral::before{background:var(--muted)}
.note-inline{font-size:11.5px;color:var(--muted)}
.note-inline.alert{color:var(--warn);font-weight:600}

/* ===================== 聚光（卡片级） ===================== */
.content.spot .card{opacity:.34;filter:saturate(.3) brightness(1);transform:scale(.972)}
.content.spot .card.lit{opacity:1;filter:none;transform:scale(1.028) translateY(-4px);
  border-color:var(--primary-soft-2);z-index:2;
  box-shadow:0 24px 48px rgba(58,92,168,.18),0 0 0 1px var(--primary-soft-2)}
.content.spot .card.lit::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--primary) 13%,transparent),transparent 62%)}
.content.spot .card.lit::after{content:"";position:absolute;top:-1px;left:9%;right:9%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--primary),transparent);background-size:220% 100%;
  animation:sweep .85s var(--ease-out)}
@keyframes sweep{from{background-position:-120% 0}to{background-position:120% 0}}
html[data-spot="soft"] .content.spot .card{opacity:.6;filter:saturate(.72);transform:scale(.99)}
html[data-spot="soft"] .content.spot .card.lit{transform:scale(1.012) translateY(-2px)}
html[data-spot="hard"] .content.spot .card{opacity:.2;filter:saturate(.1);transform:scale(.955)}
html[data-spot="hard"] .content.spot .card.lit{transform:scale(1.042) translateY(-6px)}
html[data-spot="off"] .content.spot .card{opacity:1;filter:none;transform:none}

/* ===================== 入场编排 ===================== */
.card.enter{animation:cardIn .55s var(--ease-out) both}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.972)}to{opacity:1;transform:none}}

/* ===================== 骨架屏 ===================== */
.skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--line) 37%,var(--panel-2) 63%);
  background-size:400% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* ===================== 弹窗 ===================== */
.modal-mask{position:fixed;inset:0;background:rgba(15,20,29,.42);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:50;animation:fadeIn .2s}
.modal-mask.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(640px,92vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow-l);padding:18px;animation:modalIn .26s var(--ease-out)}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-head h2{margin:0;font-size:16px;flex:1}
.modal .grp{margin-bottom:14px}
.modal .grp h4{margin:0 0 8px;font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.4px;
  display:flex;align-items:center}
.modal .group-count{font-size:10px;color:var(--muted);font-weight:500;margin-left:6px}
.modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.modal .fld{display:flex;flex-direction:column;gap:2px;padding:7px 9px;border-radius:9px;background:var(--panel-2);cursor:pointer;
  transition:border-color .3s var(--ease-out),box-shadow .3s var(--ease-out),background .2s var(--ease-out),transform .36s var(--ease-back),opacity .3s var(--ease-out),filter .3s var(--ease-out)}
.modal .fld .k{font-size:10.5px;color:var(--muted)}
.modal .fld .v{font-size:12.5px;word-break:break-all}
.modal .fld.empty{opacity:.5}
.modal .mtbar{display:flex;gap:8px;margin-bottom:12px}
.modal .mtbar button{font-size:11.5px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--text)}
.modal .mtbar button.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-soft-2);font-weight:600}

/* ===================== Toast ===================== */
.toast-box{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--primary);
  padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-m);font-size:12.5px;
  animation:toastIn .28s var(--ease-out)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px) scale(.96)}to{opacity:1;transform:none}}

@media(max-width:1080px){.stats{grid-template-columns:repeat(2,1fr)}.mid{grid-template-columns:1fr}}
@media(max-width:560px){.stats{grid-template-columns:1fr}.donut-wrap{flex-direction:column}}

/* ===================== 艺术字体 / 区块标题 ===================== */
.brand h1{font-family:var(--font-art);font-size:21px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(120deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-family:var(--font-art-num);font-style:italic}
.chartcard h3{font-family:var(--font-art);font-weight:700;letter-spacing:.4px}
.stat .val{font-family:var(--font-art-num);font-weight:900;letter-spacing:0}
.stat .sub{font-family:var(--font-art-num);font-style:italic;letter-spacing:.4px;text-transform:uppercase}
.modal-head h2{font-family:var(--font-art);font-weight:700}
.section-title{display:flex;align-items:baseline;gap:10px;margin:4px 2px 12px;padding-left:11px;position:relative}
.section-title::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:3px;
  background:linear-gradient(180deg,var(--primary),var(--accent))}
.section-title span{font-family:var(--font-art);font-size:16px;font-weight:700;color:var(--text)}
.section-title em{font-family:var(--font-art-num);font-style:italic;font-size:12px;color:var(--muted);letter-spacing:1px}

/* ===================== 物流明细 hover 浮层 ===================== */
.row-preview{position:fixed;z-index:55;width:300px;max-width:84vw;display:none;
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(16,24,40,.18);
  padding:13px 14px;font-size:12px;pointer-events:none;animation:rpIn .16s var(--ease-out)}
.row-preview.on{display:block}
@keyframes rpIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.row-preview .rp-head{font-family:var(--font-art-num);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.row-preview .rp-route{margin-top:5px;color:var(--muted);font-size:12px}
.row-preview .rp-route .arr{color:var(--primary);margin:0 4px}
.row-preview .rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:9px}
.row-preview .rp-item{display:flex;flex-direction:column;gap:1px}
.row-preview .rp-k{font-size:10px;color:var(--muted)}
.row-preview .rp-v{font-size:12.5px;word-break:break-all}
.row-preview .rp-v.mono{font-family:var(--font-art-num)}
.row-preview .rp-note{margin-top:9px;padding:7px 9px;border-radius:8px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);font-size:11.5px;line-height:1.4}
.row-preview .rp-note.alert{font-weight:600}
.row-preview .rp-muted{color:var(--muted)}

/* ===================== 物流明细弹窗 字段级 悬停聚光 + 细节浮层 ===================== */
#modalBody.spot .fld{opacity:.5;filter:saturate(.45)}
#modalBody.spot .fld.lit{opacity:1;filter:none;border-color:var(--primary-soft-2);position:relative;z-index:3;
  box-shadow:0 14px 30px rgba(58,92,168,.18),0 0 0 1px var(--primary-soft-2);transform:scale(1.02) translateY(-2px)}
#modalBody.spot .fld.lit::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(170px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--primary) 14%,transparent),transparent 62%)}
html[data-spot="soft"] #modalBody.spot .fld{opacity:.72;filter:saturate(.7)}
html[data-spot="soft"] #modalBody.spot .fld.lit{transform:scale(1.01) translateY(-1px)}
html[data-spot="hard"] #modalBody.spot .fld{opacity:.3;filter:saturate(.2)}
html[data-spot="hard"] #modalBody.spot .fld.lit{transform:scale(1.04) translateY(-3px)}
html[data-spot="off"] #modalBody.spot .fld{opacity:1;filter:none;transform:none}
html[data-spot="off"] #modalBody.spot .fld.lit{box-shadow:none;border-color:var(--primary-soft-2)}
html[data-spot="off"] #modalBody.spot .fld.lit::before{display:none}

.field-preview{position:fixed;z-index:56;width:262px;max-width:82vw;display:none;
  background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(16,24,40,.2);
  padding:12px 13px;font-size:12px;pointer-events:none;animation:fpIn .16s var(--ease-out)}
.field-preview.on{display:block}
@keyframes fpIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.field-preview .fp-grp{font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.field-preview .fp-label{font-family:var(--font-art);font-weight:700;font-size:13px;margin:3px 0 7px;display:flex;align-items:baseline;gap:7px}
.field-preview .fp-key{font-family:var(--font-art-num);font-style:italic;font-size:10.5px;color:var(--muted);font-weight:500}

.field-preview .fp-hint{margin-top:8px;font-size:10.5px;color:var(--primary);display:flex;align-items:center;gap:5px}
</style>

<body>

<!-- 密码门 -->
<div id="passwordGate" class="gate">
  <div class="gate-card">
    <div class="gate-logo">绿</div>

</div>

<div class="wrap">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo">绿</div>
    <div class="brand">
      <h1>绿动业务物流进度</h1>
      <p>锦源晟绿动实时供应链追踪</p>
    </div>
    <div class="spacer"></div>
    <div class="syncinfo">数据同步：<b id="syncTime">—</b><span class="dot" id="syncDot"></span></div>
    <div class="syncinfo" id="currentDate"></div>
    <button class="toolbtn" id="refreshBtn">⟳ 刷新</button>
    <button class="toolbtn" id="themeBtn">🌙 深色</button>
    <div class="chips" title="悬停聚光强度">
      <button class="chip" data-spot="off">关</button>
      <button class="chip" data-spot="soft">弱</button>
      <button class="chip on" data-spot="std">标准</button>
      <button class="chip" data-spot="hard">强</button>

  <!-- 核心概览 -->
  <div class="content" id="content">
    <div class="section-title"><span>核心概览</span><em>Overview</em></div>
    <div class="stats" id="stats">
      <div class="card stat blue"><div class="ico">📦</div><div class="lbl">全部订单</div><div class="val" id="statTotal">0</div><div class="sub">Total Orders</div><div class="amt" id="statTotalAmt">合计 —</div></div>
      <div class="card stat arrived"><div class="ico">⚓</div><div class="lbl">已到港</div><div class="val" id="statArrived">0</div><div class="sub">Arrived</div><div class="amt" id="statArrivedAmt">合计 —</div></div>
      <div class="card stat shipped"><div class="ico">🚢</div><div class="lbl">海运中</div><div class="val" id="statShipped">0</div><div class="sub">Shipped</div><div class="amt" id="statShippedAmt">合计 —</div></div>
      <div class="card stat delivered"><div class="ico">✅</div><div class="lbl">已交付</div><div class="val" id="statDelivered">0</div><div class="sub">Delivered</div><div class="amt" id="statDeliveredAmt">合计 —</div></div>
    </div>
  </div>

  <!-- 中部环形图 -->
  <div class="section-title"><span>状态分析</span><em>Analytics</em></div>
  <div class="mid" id="content2">
    <div class="card chartcard">
      <h3>物流状态分布</h3>
      <div class="hint">悬停扇区或图例可联动高亮</div>
      <div class="donut-wrap" data-peers id="donutStatus">
        <div class="donut-box">
          <svg viewBox="0 0 240 240" width="170" height="170" id="svgStatus"></svg>
          <div class="center"><div class="n" id="statusTotal">0</div><div class="t">订单总数</div></div>
        </div>
        <div class="legend" id="legendStatus"></div>
      </div>
    </div>
    <div class="card chartcard">
      <h3>运输方式分布</h3>
      <div class="hint">按柜量统计</div>
      <div class="donut-wrap" data-peers id="donutMode">
        <div class="donut-box">
          <svg viewBox="0 0 240 240" width="170" height="170" id="svgMode"></svg>
          <div class="center"><div class="n" id="modeTotal">0</div><div class="t">总柜量</div></div>
        </div>
        <div class="legend" id="legendMode"></div>
      </div>
    </div>
  </div>

  <!-- 表格 -->
  <div class="section-title"><span>物流明细</span><em>Details</em></div>
  <div class="card tablecard" data-peers id="tableCard">
    <div class="tbar">
      <div class="seg" id="statusSeg">
        <button class="on" data-s="all">全部</button>
        <button data-s="In Transit">已到港</button>
        <button data-s="Shipped">海运中</button>
        <button data-s="Delivered">已交付</button>

      <select id="carrierFilter"><option value="">全部承运商</option></select>

      <div class="spacer"></div>

    </div>
    <table>
      <thead><tr>
        <th>合同号</th><th>提单号</th><th>状态</th><th>注意事项</th><th>承运商</th>
        <th>启运港</th><th>目的港</th><th>ETA</th><th>柜号</th><th>柜型</th><th>柜量</th><th>金额</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- 明细弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">物流明细</h2><button class="toolbtn" id="modalClose">✕</button></div>
    <div class="mtbar">
      <button id="toggleEmpty">显示空字段</button>
      <button id="copyJson">📋 复制行 JSON</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast-box" id="toastBox"></div>
<div class="row-preview" id="rowPreview"></div>
<div class="field-preview" id="fieldPreview"></div>

<script>
/* ============ 状态字典（中英文，覆盖全部同步状态） ============ */
const STATUS_LABEL={'In Transit':'已到港 Arrived','Shipped':'海运中 Shipped','Delivered':'已交付 Delivered',
  'Pending':'待发货 Pending','Received':'已收货 Received','Delayed':'延期 Delayed'};
function badgeClass(s){return s==='In Transit'?'transit':s==='Shipped'?'shipped':s==='Delivered'?'delivered':'neutral';}
function badge(s){const label=STATUS_LABEL[s]||String(s||'—');return '<span class="badge badge-'+badgeClass(s)+'">'+esc(label)+'</span>';}

/* ============ 明细分组（与腾讯文档表头 1:1，key 精确匹配 allCols.key） ============ */
const GROUPS=[
  ['订单与单证',['contractNo','blNo','carrier','shipCompany','releaseType','reportNo']],
  ['港口与船期',['shipper','destination','transitPort','etdShipper','etaTransit','etdTransit','etaDest','vessel']],
  ['集装箱与货物',['containerNo','containerType','containerCount','packages','cargoName','quantity','unit','netWeight','grossWeight']],
  ['结算与放行',['unitPrice','totalPrice','currency','releaseTime','actualRelease','receiptDate','releaseExec']],
  ['其他',['status','transportMode','notes']]
];

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fmt=v=>(v==null||v==='')?'—':String(v);
function toNum(v){if(v==null||v==='')return null;if(typeof v==='number')return isNaN(v)?null:v;const c=String(v).replace(/[,\s?￥$]/g,'');if(!c)return null;const n=Number(c);return isNaN(n)?null:n;}
function fmtNum(v){const n=toNum(v);return n==null?String(v).trim():n.toLocaleString('en-US');}
function fmtMoney(v){const n=toNum(v);return n==null?'—':'¥'+n.toLocaleString('zh-CN',{maximumFractionDigits:0});}

/* ============ 数据状态 ============ */
let DATA=[];               // 解密后的真实行（来自腾讯文档同步）
let sessionPassword='';    // 仅存内存，刷新即失效
let lastFetchTime='';
let autoPoller=null;
const DATA_URL='https://kamlshi.github.io/logistics-dashboard/data.json';

/* ---- 解密（PBKDF2-SHA256 + AES-256-GCM，与 sync.py 互通） ---- */
function b64ToBytes(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes;}
async function decryptData(encObj,password){
  const salt=b64ToBytes(encObj.salt),iv=b64ToBytes(encObj.iv),data=b64ToBytes(encObj.data);
  const keyMat=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:encObj.iter||150000,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  return JSON.parse(new TextDecoder().decode(plain));
}
async function fetchDataJSON(){
  if(!sessionPassword)return false;
  try{
    const resp=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const raw=await resp.json();
    let json;
    if(raw&&raw.data&&raw.salt&&raw.iv){json=await decryptData(raw,sessionPassword);}
    else json=raw; // 兼容未加密旧数据
    DATA=json.rows||json.orders||[];
    lastFetchTime=json.lastUpdated||new Date().toISOString();
    return true;
  }catch(e){console.warn('[Dashboard] fetch/decrypt 失败:',e.message);return false;}
}

/* ============ 悬停聚光（卡片级 + 同级联动） ============ */
const S={spot:'std'};
const ctEl=$('#content');
function setSpot(v){S.spot=v;document.documentElement.dataset.spot=v;
  try{localStorage.setItem('zz.spot',v)}catch(e){}if(v==='off')clearSpot();toast('悬停聚光 · '+( {off:'关闭',soft:'微弱',std:'标准',hard:'强烈'}[v]));}
function clearSpot(){ctEl.classList.remove('spot');$$('.card.lit').forEach(x=>x.classList.remove('lit'));}
ctEl.addEventListener('mouseover',e=>{if(S.spot==='off')return;const c=e.target.closest('.card');
  if(!c){clearSpot();return;}if(c.classList.contains('lit'))return;ctEl.classList.add('spot');
  $$('.card').forEach(x=>x.classList.toggle('lit',x===c));});
ctEl.addEventListener('mouseleave',clearSpot);
ctEl.addEventListener('mousemove',e=>{const lit=ctEl.querySelector('.card.lit');if(!lit)return;
  const r=lit.getBoundingClientRect();lit.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
  lit.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');},{passive:true});
// 同级联动（全局事件代理）
let curLit=[],curGroups=[];
function clearPeers(){curLit.forEach(n=>n.classList.remove('lit'));curGroups.forEach(g=>{if(g)g.classList.remove('spot')});curLit=[];curGroups=[];}
function focusPeer(el){if(S.spot==='off')return;clearPeers();
  const sync=el.dataset.sync;const nodes=sync?[...document.querySelectorAll('[data-sync="'+sync+'"]')]:[el];
  if(!nodes.length)return;const gs=new Set();
  nodes.forEach(n=>{n.classList.add('lit');gs.add(n.closest('[data-peers]')||n.parentElement);});
  gs.forEach(g=>{if(g){g.dataset.peers='';g.classList.add('spot');}});
  curLit=nodes;curGroups=[...gs];}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-peer]');if(!el){clearPeers();return;}
  if(el.classList.contains('lit'))return;focusPeer(el);});
document.addEventListener('mouseleave',clearPeers);
// 强度档
$$('[data-spot]').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');setSpot(b.dataset.spot);document.dispatchEvent(new Event('spotchange'));}));

/* ============ 主题 ============ */
try{const t=localStorage.getItem('zz.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
$('#themeBtn').addEventListener('click',()=>{const d=document.documentElement;
  const next=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=next;
  $('#themeBtn').textContent=next==='dark'?'☀️ 浅色':'🌙 深色';
  try{localStorage.setItem('zz.theme',next)}catch(e){}});
try{const v=localStorage.getItem('zz.spot');if(v){S.spot=v;document.documentElement.dataset.spot=v;
  $$('[data-spot]').forEach(b=>b.classList.toggle('on',b.dataset.spot===v));}}catch(e){}

/* ============ KPI 数字滚动 ============ */
const _last={};
function roll(id,target){const el=$('#'+id);const from=_last[id]||0;_last[id]=target;
  const dur=950,start=performance.now();el.classList.add('rolling');
  function tick(now){const p=Math.min(1,(now-start)/dur);const e=1-Math.pow(1-p,4);
    el.textContent=Math.round(from+(target-from)*e);if(p<1)requestAnimationFrame(tick);else el.classList.remove('rolling');}
  requestAnimationFrame(tick);}

/* ============ 环形图（手写 SVG，无 CDN） ============ */
const R=90,CX=120,CY=120,C=2*Math.PI*R;
function renderDonut(svgId,legendId,segs,totalId){
  const svg=$('#'+svgId);svg.innerHTML='';const legend=$('#'+legendId);legend.innerHTML='';
  let acc=0;const tot=segs.reduce((a,s)=>a+s.value,0)||1;
  segs.forEach((s,i)=>{
    const len=(s.value/tot)*C;const start=-90+acc/tot*360;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform',`rotate(${start} ${CX} ${CY})`);g.dataset.peers='';
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',CX);c.setAttribute('cy',CY);c.setAttribute('r',R);c.setAttribute('fill','none');
    c.setAttribute('stroke',s.color);c.setAttribute('stroke-width','22');c.setAttribute('stroke-linecap','butt');
    c.setAttribute('stroke-dasharray',`0 ${C}`);c.dataset.peer='';c.dataset.sync='dn-'+svgId+'-'+i;
    g.appendChild(c);svg.appendChild(g);acc+=s.value;
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{c.style.transition='stroke-dasharray .9s var(--ease-out)';c.setAttribute('stroke-dasharray',`${len} ${C}`);});});
    const it=document.createElement('div');it.className='item';it.dataset.peer='';it.dataset.sync='dn-'+svgId+'-'+i;
    it.innerHTML=`<span class="dot" style="background:${s.color}"></span><span class="ln">${esc(s.label)}</span><span class="lv">${s.value}</span>`;
    legend.appendChild(it);
  });
  $('#'+totalId).textContent=tot;
}

/* ============ 表格 ============ */
let curFilter={status:'all',carrier:'',search:''};
function renderTable(){
  const f=curFilter;
  const rows=DATA.filter(d=>{
    if(f.status!=='all'&&d.status!==f.status)return false;
    if(f.carrier&&d.carrier!==f.carrier)return false;
    const s=f.search.toLowerCase();
    if(s&&!(String(d.contractNo||'').toLowerCase().includes(s)||String(d.blNo||'').toLowerCase().includes(s)||String(d.containerNo||'').toLowerCase().includes(s)||String(d.notes||'').toLowerCase().includes(s)))return false;
    return true;
  });
  const tb=$('#tableBody');
  if(!rows.length){tb.innerHTML=`<tr><td colspan="12"><div style="padding:30px;text-align:center;color:var(--muted)">📭 暂无匹配记录</div></td></tr>`;$('#tableInfo').textContent='显示 0 条';return;}
  tb.innerHTML=rows.map((d,i)=>{
    const note=d.notes?`<span class="note-inline ${String(d.notes).includes('预警')?'alert':''}">${esc(d.notes)}</span>`:'<span style="color:var(--muted)">·</span>';
    return `<tr data-peer data-id="${esc(d.id)}" style="animation:cardIn .4s var(--ease-out) both;animation-delay:${i*40}ms">
      <td><span class="mono">${fmt(d.contractNo)}</span></td>
      <td><span class="mono">${fmt(d.blNo)}</span></td>
      <td>${badge(d.status)}</td>
      <td class="col-note">${note}</td>
      <td>${fmt(d.carrier)}</td>
      <td>${fmt(d.shipper)}</td>
      <td>${fmt(d.destination)}</td>
      <td><span class="mono">${fmt(d.etaDest)}</span></td>
      <td><span class="mono">${fmt(d.containerNo)}</span></td>
      <td>${fmt(d.containerType)}</td>
      <td><span class="mono">${d.containerCount}</span></td>
      <td><span class="mono">${fmtMoney(d.totalPrice)}</span></td>
    </tr>`;
  }).join('');
  const amt=rows.reduce((s,d)=>s+(Number(d.totalPrice)||0),0);
  tb.innerHTML+=`<tr class="sumrow"><td colspan="10" style="text-align:right;color:var(--muted);font-size:12px">合计</td><td style="color:var(--muted)">${rows.length} 条</td><td><span class="mono" style="color:var(--primary);font-weight:600">${fmtMoney(amt)}</span></td></tr>`;
  $('#tableInfo').textContent=`显示 ${rows.length} 条记录`;
}

/* ============ 弹窗（优先用 allCols 真实明细，key 分组） ============ */
let showEmpty=false,curRow=null;
function isMoneyLabel(l){return l.indexOf('单价')>=0||l.indexOf('总价')>=0;}
function isNumLabel(l){return ['柜量','件数','数量','净重','毛重'].some(k=>l.indexOf(k)>=0);}
function valHtml(label,val){
  if(val==null||val==='')return '—';
  if(isMoneyLabel(label))return fmtMoney(val);
  if(isNumLabel(label))return fmtNum(val);
  return esc(val);
}
function openModal(id){
  curRow=DATA.find(d=>d.id===id);if(!curRow)return;
  $('#modalTitle').textContent=(curRow.contractNo||curRow.blNo||'物流明细')+' · 物流明细';
  const body=$('#modalBody');body.innerHTML='';
  const groupOf={};GROUPS.forEach(([g,keys])=>keys.forEach(k=>groupOf[k]=g));
  const groupMap={};GROUPS.forEach(([g])=>groupMap[g]=[]);
  const others=[];
  const cols=(curRow.allCols&&curRow.allCols.length)?curRow.allCols:null;
  if(cols){
    cols.forEach(c=>{const g=groupOf[c.key];const item={label:c.label,key:c.key,val:c.value};if(g)groupMap[g].push(item);else others.push(item);});
  }else{
    GROUPS.forEach(([g,keys])=>keys.forEach(k=>{if(curRow[k]!=null&&curRow[k]!=='')groupMap[g].push({label:k,key:k,val:curRow[k]});}));
  }
  others.forEach(it=>groupMap['其他'].push(it));
  GROUPS.forEach(([g])=>{
    const items=groupMap[g];if(!items||!items.length)return;
    const shown=items.filter(f=>showEmpty||(f.val!=null&&f.val!==''));if(!shown.length)return;
    const div=document.createElement('div');div.className='grp';
    div.innerHTML='<h4>'+esc(g)+'<span class="group-count">'+shown.length+'/'+items.length+' 有值</span></h4><div class="grid">'+
      shown.map(f=>'<div class="fld '+(f.val==null||f.val===''?'empty':'')+'" data-grp="'+esc(g)+'" data-label="'+esc(f.label)+'" data-key="'+esc(f.key||'')+'" data-value="'+esc(f.val==null?'':f.val)+'"><span class="k">'+esc(f.label)+'</span><span class="v">'+valHtml(f.label,f.val)+'</span></div>').join('')+
      '</div>';
    body.appendChild(div);
  });
  $('#modalMask').classList.add('on');
}
$('#modalClose').addEventListener('click',()=>$('#modalMask').classList.remove('on'));
$('#modalMask').addEventListener('click',e=>{if(e.target===$('#modalMask'))$('#modalMask').classList.remove('on');});
$('#toggleEmpty').addEventListener('click',function(){showEmpty=!showEmpty;this.classList.toggle('on',showEmpty);if(curRow)openModal(curRow.id);});
$('#copyJson').addEventListener('click',()=>{if(!curRow)return;navigator.clipboard.writeText(JSON.stringify(curRow,null,2));toast('已复制行 JSON');});

/* ============ 物流明细 hover 浮层（聚光 + 细节显示） ============ */
(function(){
  const prev=document.getElementById('rowPreview');const tb=document.getElementById('tableBody');
  if(!prev||!tb)return;let curId=null;
  const ev=v=>(v==null||v==='')?'<span class="rp-muted">—</span>':esc(v);
  function pair(k,v,mono){return '<div class="rp-item"><span class="rp-k">'+k+'</span><span class="rp-v'+(mono?' mono':'')+'">'+v+'</span></div>';}
  function fill(d){
    const cn=(d.containerNo||'').split(/\s+/).filter(Boolean).join('<br>');
    prev.innerHTML=
      '<div class="rp-head"><span>'+ev(d.contractNo)+'</span>'+badge(d.status)+'</div>'+
      '<div class="rp-route">'+ev(d.shipper)+' <span class="arr">➜</span> '+ev(d.destination)+'</div>'+
      '<div class="rp-grid">'+
        pair('柜号',cn||'—',true)+
        pair('提单号',ev(d.blNo),true)+
        pair('承运商',ev(d.carrier))+
        pair('柜型/柜量',ev((d.containerType||'—')+' / '+(d.containerCount!=null?d.containerCount:'—')))+
        pair('毛重/净重',ev((d.grossWeight||'—')+' / '+(d.netWeight||'—')))+
        pair('ETA',ev(d.etaDest),true)+
        pair('金额',fmtMoney(d.totalPrice),true)+
        pair('放行',ev(d.actualRelease||d.releaseTime))+
      '</div>'+
      (d.notes?'<div class="rp-note'+(String(d.notes).includes('预警')?' alert':'')+'">⚠ '+esc(d.notes)+'</div>':'');
  }
  function place(e){const pad=18,w=prev.offsetWidth,h=prev.offsetHeight;
    let x=e.clientX+pad,y=e.clientY+pad;
    if(x+w>innerWidth-8)x=e.clientX-w-pad;
    if(y+h>innerHeight-8)y=innerHeight-h-8;
    if(y<8)y=8;prev.style.left=x+'px';prev.style.top=y+'px';}
  tb.addEventListener('mouseover',e=>{const tr=e.target.closest('tr[data-id]');if(!tr)return;
    const id=tr.dataset.id;if(id===curId)return;curId=id;const d=DATA.find(x=>x.id===id);if(!d)return;fill(d);prev.classList.add('on');place(e);});
  tb.addEventListener('mousemove',e=>{if(prev.classList.contains('on'))place(e);});
  tb.addEventListener('mouseleave',()=>{prev.classList.remove('on');curId=null;});
})();

/* ============ 物流明细弹窗内 字段悬停聚光 + 细节浮层 ============ */
(function(){
  const body=document.getElementById('modalBody');
  const fp=document.getElementById('fieldPreview');
  const mask=document.getElementById('modalMask');
  if(!body||!fp)return;
  let curFld=null;
  const fv=v=>(v==null||v==='')?'<span style="color:var(--muted)">（空字段）</span>':esc(v);
  function isMoney(l){return l!=null&&(String(l).indexOf('单价')>=0||String(l).indexOf('总价')>=0);}
  function isNum(l){return l!=null&&['柜量','件数','数量','净重','毛重'].some(k=>String(l).indexOf(k)>=0);}
  function show(d){
    const mono=(isMoney(d.label)||isNum(d.label)||isMoney(d.key)||isNum(d.key))?' mono':'';
    fp.innerHTML=
      '<div class="fp-grp">'+esc(d.grp||'明细')+'</div>'+
      '<div class="fp-label">'+esc(d.label)+(d.key?'<span class="fp-key">'+esc(d.key)+'</span>':'')+'</div>'+
      '<div class="fp-val'+mono+'">'+fv(d.value)+'</div>'+
      '<div class="fp-hint">📋 点击字段即可复制</div>';
  }
  function place(e){const pad=14,w=fp.offsetWidth,h=fp.offsetHeight;
    let x=e.clientX+pad,y=e.clientY+pad;
    if(x+w>innerWidth-8)x=e.clientX-w-pad;
    if(y+h>innerHeight-8)y=innerHeight-h-8;
    if(y<8)y=8;if(x<8)x=8;
    fp.style.left=x+'px';fp.style.top=y+'px';}
  function cleanup(){if(curFld){curFld.classList.remove('lit');curFld=null;}body.classList.remove('spot');fp.classList.remove('on');}
  body.addEventListener('mouseover',e=>{
    const f=e.target.closest('.fld');if(!f)return;
    if(S.spot!=='off')body.classList.add('spot');
    if(f!==curFld){cleanup();curFld=f;
      if(S.spot!=='off')f.classList.add('lit');
      show({grp:f.dataset.grp,label:f.dataset.label,key:f.dataset.key,value:f.dataset.value});
      fp.classList.add('on');}
    place(e);
  });
  body.addEventListener('mousemove',e=>{
    if(!curFld)return;
    const r=curFld.getBoundingClientRect();
    curFld.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
    curFld.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
    if(fp.classList.contains('on'))place(e);
  });
  body.addEventListener('mouseleave',cleanup);
  body.addEventListener('click',e=>{
    const f=e.target.closest('.fld');if(!f)return;
    const v=f.dataset.value;if(v==null||v===''){toast('该字段为空，无可复制内容');return;}
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject())
      .then(()=>toast('已复制：'+(f.dataset.label||'字段')))
      .catch(()=>toast('复制失败，请手动选择'));
  });
  document.getElementById('modalClose').addEventListener('click',cleanup);
  mask.addEventListener('click',e=>{if(e.target===mask)cleanup();});
  document.addEventListener('spotchange',()=>{if(S.spot==='off')cleanup();});
})();

/* ============ 主渲染 ============ */
function renderAll(){
  const total=DATA.length;
  const arr=d=>DATA.filter(x=>x.status===d).length;
  roll('statTotal',total);roll('statArrived',arr('In Transit'));roll('statShipped',arr('Shipped'));roll('statDelivered',arr('Delivered'));
  const sumAmt=l=>DATA.filter(x=>x.status===l).reduce((s,x)=>s+(Number(x.totalPrice)||0),0);
  $('#statTotalAmt').textContent='合计 '+fmtMoney(DATA.reduce((s,x)=>s+(Number(x.totalPrice)||0),0));
  $('#statArrivedAmt').textContent='合计 '+fmtMoney(sumAmt('In Transit'));
  $('#statShippedAmt').textContent='合计 '+fmtMoney(sumAmt('Shipped'));
  $('#statDeliveredAmt').textContent='合计 '+fmtMoney(sumAmt('Delivered'));
  const stSegs=[['已到港 Arrived','In Transit','var(--st-arrived)'],['海运中 Shipped','Shipped','var(--st-shipped)'],['已交付 Delivered','Delivered','var(--st-delivered)']]
    .map(([label,key,color])=>({label,color,value:arr(key)}));
  renderDonut('svgStatus','legendStatus',stSegs,'statusTotal');
  const modeMap={};let modeSum=0;
  DATA.forEach(d=>{const m=d.transportMode||'其他';modeMap[m]=(modeMap[m]||0)+(Number(d.containerCount)||0);modeSum+=(Number(d.containerCount)||0);});
  const modeColors=['var(--primary)','var(--accent)','var(--st-delivered)','var(--st-arrived)','var(--info)'];
  const modeSegs=Object.keys(modeMap).map((m,i)=>({label:m,color:modeColors[i%modeColors.length],value:modeMap[m]}));
  renderDonut('svgMode','legendMode',modeSegs,'modeTotal');
  const carriers=[...new Set(DATA.map(d=>d.carrier).filter(Boolean))];
  const cf=$('#carrierFilter');cf.innerHTML='<option value="">全部承运商</option>'+carriers.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  cf.value=curFilter.carrier;
  renderTable();
  $$('.card').forEach((c,i)=>{c.classList.add('enter');setTimeout(()=>c.classList.remove('enter'),600+Math.min(i,12)*45);});
}

/* ============ 交互绑定 ============ */
$('#statusSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  $$('#statusSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  curFilter.status=b.dataset.s;renderTable();});
$('#carrierFilter').addEventListener('change',e=>{curFilter.carrier=e.target.value;renderTable();});
$('#searchInput').addEventListener('input',e=>{curFilter.search=e.target.value;renderTable();});
$('#tableBody').addEventListener('click',e=>{const tr=e.target.closest('tr[data-id]');if(tr)openModal(tr.dataset.id);});
$('#refreshBtn').addEventListener('click',manualRefresh);

/* ============ Toast ============ */
function toast(msg){const b=$('#toastBox');const t=document.createElement('div');t.className='toast';t.textContent=msg;
  b.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';t.style.transition='.24s';setTimeout(()=>t.remove(),240);},1800);}

/* ============ 密码门 ============ */
function showGateError(m){const e=$('#gateError');if(e)e.textContent=m||'';}
function hideGate(){const g=$('#passwordGate');if(g)g.style.display='none';document.body.classList.add('unlocked');}
async function unlock(pw){
  sessionPassword=pw;showGateError('');
  const btn=$('#gateSubmit');if(btn){btn.disabled=true;btn.textContent='校验中...';}
  const ok=await loadAndRender();
  if(ok){hideGate();startAutoPoll(30000);toast('数据已解密并加载');}
  else{sessionPassword='';showGateError('密码错误或加载失败，请重试');if(btn){btn.disabled=false;btn.textContent='进入';}}
}
function setupPasswordGate(){
  const input=$('#gatePassword'),btn=$('#gateSubmit');
  const submit=()=>{const pw=(input.value||'').trim();if(!pw)return;unlock(pw);};
  if(btn)btn.addEventListener('click',submit);
  if(input){input.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});input.focus();}
}

/* ============ 同步 / 刷新 ============ */
async function triggerSync(){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),90000);
  try{
    const resp=await fetch('http://127.0.0.1:8765/sync',{mode:'cors',cache:'no-store',signal:ctrl.signal});
    clearTimeout(t);
    if(!resp.ok){let msg='同步服务返回错误';try{const j=await resp.json();msg=j.message||msg;}catch(e){}return {ok:false,message:msg};}
    const j=await resp.json();
    if(j&&j.ok)return {ok:true,rowCount:j.rowCount,lastUpdated:j.lastUpdated,message:j.message};
    return {ok:false,message:(j&&j.message)||'同步失败'};
  }catch(e){clearTimeout(t);return {ok:false,offline:true,message:'本地同步服务未启动'};}
}
async function loadAndRender(){
  const ok=await fetchDataJSON();
  const dot=$('#syncDot');
  if(ok){
    renderAll();
    const el=$('#syncTime');if(el)el.textContent=formatSyncTime(lastFetchTime);
    if(dot)dot.style.background='#10b981';
  }else{
    if(dot)dot.style.background='#f59e0b';
  }
  return ok;
}
async function manualRefresh(){
  const btn=$('#refreshBtn');const original=btn.innerHTML;
  btn.innerHTML='<span>⏳</span> 同步中...';btn.disabled=true;
  const sync=await triggerSync();
  if(sync.ok){toast('✅ 已从腾讯文档同步最新数据（'+(sync.rowCount||0)+' 行）');await loadAndRender();}
  else if(sync.offline){const ok=await loadAndRender();toast(ok?'✅ 已加载线上最新数据（本机同步服务未运行）':'⚠️ 加载线上数据失败');}
  else{toast('❌ 本地同步失败：'+(sync.message||''));await loadAndRender();}
  btn.innerHTML=original;btn.disabled=false;
}
function startAutoPoll(ms){if(autoPoller)clearInterval(autoPoller);autoPoller=setInterval(loadAndRender,ms);}
function formatSyncTime(iso){
  if(!iso)return '—';const d=new Date(iso);
  if(isNaN(d.getTime())){const s=String(iso);return s.length>=19?s.slice(0,19).replace('T',' '):s;}
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function initDate(){const el=$('#currentDate');if(el)el.textContent=new Date().toLocaleDateString('zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}

/* ============ 启动 ============ */
document.addEventListener('DOMContentLoaded',()=>{
  initDate();
  setupPasswordGate();
  const tb=$('#tableBody');
  if(tb)tb.innerHTML=Array.from({length:4}).map(()=>'<tr><td colspan="12"><div class="skel" style="height:18px"></div></td></tr>').join('');
});
</script>
